# Consensus signal layer (Phase B). Structure = Claude scaffold; values = 사용자 확정 필요.
# - decks: 본인이 C:/temp/earnings_forecast/decks/ 에 둔 IR 실적 deck PDF 매핑.
#   event_label = 실적이 가리키는 분기, doc_date = 실적발표(콜) 일자 ≈ T0. (드래프트 일자, 본인 확정)
# - topic_taxonomy: 추출 비교 일관성용 후보 토픽(non-binding hint). 본인이 가감.
# - event_window: CAR 윈도(거래일). benchmark = 시장지수(^KS11). 229200.KS은 robustness(미사용).
# - call_brief.mdna: forward 브리핑 입력 DART 보고서 rcpNo(공개뷰어, 키 불요). Phase 0 검증 rcpNo는 예시.
signal_layer:
  decks_dir: "C:/temp/earnings_forecast/decks"
  topic_taxonomy:
    - "HBM 수요/캐파"
    - "DRAM 가격"
    - "NAND 수요/가격"
    - "AI 서버 수요"
    - "capex/투자"
    - "재고"
    - "선단공정 전환"
  event_window:
    primary_days: 1
    secondary_days: 5
    benchmark: "^KS11"
  decks:
    - { filename: "skhynix_2024q1.pdf", event_label: "2024Q1", period_label: "2024Q1", doc_date: "2024-04-25" }
    - { filename: "skhynix_2024q2.pdf", event_label: "2024Q2", period_label: "2024Q2", doc_date: "2024-07-25" }
    - { filename: "skhynix_2024q3.pdf", event_label: "2024Q3", period_label: "2024Q3", doc_date: "2024-10-24" }
    - { filename: "skhynix_2024q4.pdf", event_label: "2024Q4", period_label: "2024Q4", doc_date: "2025-01-23" }
    - { filename: "skhynix_2025q1.pdf", event_label: "2025Q1", period_label: "2025Q1", doc_date: "2025-04-24" }
    - { filename: "skhynix_2025q2.pdf", event_label: "2025Q2", period_label: "2025Q2", doc_date: "2025-07-24" }
    - { filename: "skhynix_2025q3.pdf", event_label: "2025Q3", period_label: "2025Q3", doc_date: "2025-10-23" }
    - { filename: "skhynix_2025q4.pdf", event_label: "2025Q4", period_label: "2025Q4", doc_date: "2026-01-22" }
  call_brief:
    target_event: "2026Q2"
    mdna:
      rcp_no: "20240814003052"        # 예시(2024 반기보고서) — 본인이 최신 분기/사업보고서 rcpNo로 교체
      period_label: "2026Q1"
      doc_date: "2026-05-15"

