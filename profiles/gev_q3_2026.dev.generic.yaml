  - { quarter_label: "2026Q2", period_end: 2026-06-30, revenue_total: 11104, net_profit: 668, diluted_shares: 270000000, source: "GE Vernova 2026Q2 10-Q filed 2026-07-22: net income attributable to GE Vernova $668M (consolidated net income $649M; NCI loss $19M), diluted weighted-average shares 270M, as-filed diluted EPS $2.47; consolidated operating income $653M (5.88%)" }

window:
  start_quarter: "2026Q3"
