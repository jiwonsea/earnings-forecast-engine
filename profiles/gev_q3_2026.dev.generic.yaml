  revenue_growth_qoq: [0.10, 0.13, -0.22, 0.15]
  op_margin: [0.075, 0.085, 0.035, 0.068]
  effective_tax_rate: 0.27
  net_interest_pct_of_revenue: 0.016
bear:
  probability: 0.25
  rationale: "DEV 검증용 하단. Wind 개선 지연과 프로젝트 비용, 높은 유효세율을 반영. Lumpy below-OP 이익은 base와 마찬가지로 넣지 않음."
  revenue_growth_qoq: [0.06, 0.09, -0.25, 0.10]
  op_margin: [0.055, 0.065, 0.020, 0.050]
  effective_tax_rate: 0.30
  net_interest_pct_of_revenue: 0.016
bull:
  probability: 0.25
  rationale: "DEV 검증용 상단. Power 가격·서비스와 Electrification 전환, Wind 손익 개선 가속 및 낮은 정상화 세율을 반영. 처분이익 등 lumpy below-OP는 사전 근거가 없어 제외."
  revenue_growth_qoq: [0.12, 0.15, -0.20, 0.19]
  op_margin: [0.095, 0.105, 0.050, 0.085]
  effective_tax_rate: 0.23
  net_interest_pct_of_revenue: 0.016

