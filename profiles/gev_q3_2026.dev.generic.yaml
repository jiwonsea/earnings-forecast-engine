# ---------------------------------------------------------------------------
# Forward scenarios (2026Q3..2027Q2). DEV-only top-down assumptions:
# revenue_growth_qoq and op_margin are positional forward-step vectors
# [Q3, Q4, Q1, Q2]. They are not calendar-slot vectors.
# Consolidated GAAP op_margin already includes Wind, corporate and D&A; no Wind
# overlay is applied. Q2 actual was 5.88%. Q3-Q2 forward vectors test the
# disclosed Wind breakeven ramp and seasonality without changing engine code.
# Tax spans 23-30% because Q2's 29.8% included provisional Prolec purchase-price
# allocation and losses with no tax benefit. net_interest_pct is the steady
# below-OP pretax component; unpredictable disposal gains remain base=0.
# Provisional FY2026 revenue aligns near the raised $45.5-46.5B guidance range.
# ---------------------------------------------------------------------------
